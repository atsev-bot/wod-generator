<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoD Generator — Random Workout of the Day</title>
  <meta name="description" content="Generate randomized complete workouts with sets, reps, and rest times. Full body, upper, lower, push, pull, and HIIT.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🏋️ WoD Generator</div>
      <p class="tagline">Random Workout of the Day — every day is different</p>
    </div>

    <div class="config">
      <div class="config-row">
        <label class="config-label">Workout Type</label>
        <div class="btn-group">
          <button class="btn-option active" data-type="fullBody">💪 Full Body</button>
          <button class="btn-option" data-type="upperBody">🏋️ Upper</button>
          <button class="btn-option" data-type="lowerBody">🦵 Lower</button>
          <button class="btn-option" data-type="push">👊 Push</button>
          <button class="btn-option" data-type="pull">🤙 Pull</button>
          <button class="btn-option" data-type="hiit">🔥 HIIT</button>
        </div>
      </div>
      <div class="config-row">
        <label class="config-label">Difficulty</label>
        <div class="btn-group">
          <button class="btn-option" data-diff="beginner">🌱 Beginner</button>
          <button class="btn-option active" data-diff="intermediate">⚡ Intermediate</button>
          <button class="btn-option" data-diff="advanced">🔥 Advanced</button>
        </div>
      </div>
    </div>

    <button class="btn-generate" id="generate-btn">🏋️ Generate Workout</button>

    <div class="workout" id="workout">
      <div class="workout-header">
        <div class="wod-name" id="wod-name"></div>
        <div class="wod-meta" id="wod-meta"></div>
      </div>
      <div class="exercise-list" id="exercise-list"></div>
    </div>

    <div class="footer">
      <p>🏋️ WoD Generator — randomized workouts, every time.<br>No signup needed. No data stored. Just lift.</p>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
